name: Run Tests

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - '**'

jobs:
  Unit_Tests:
    runs-on: ubuntu-latest
    steps:
    - name: Show disk usage before cleanup
      run: df -h
    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/lib/android
        sudo docker image prune --all --force
        sudo docker builder prune -a
    - name: Show disk usage after cleanup
      run: df -h
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_project_without_torch.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements_project_without_torch.txt
    
    - name: Run test_full.py
      run: |
        python tests/test_full.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Run test_reranking.py
      run: |
        python tests/test_reranking.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Trigger Jenkins docker pipeline
      if: success()
      env:
        JENKINS_URL: ${{ secrets.JENKINS_URL }}
        JENKINS_USER: ${{ secrets.JENKINS_USER }}
        JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
      run: |
        if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_USER" ] || [ -z "$JENKINS_API_TOKEN" ] || [ -z "$JENKINS_JOB" ]; then
          echo "Required Jenkins secrets are missing. Skipping Jenkins trigger."
          exit 0
        fi

        echo "Requesting Jenkins crumb..."
        CRUMB_RESPONSE=$(curl -s -u "$JENKINS_USER:$JENKINS_API_TOKEN" "$JENKINS_URL/crumbIssuer/api/json" || true)
        if [ -n "$CRUMB_RESPONSE" ]; then
          CRUMB=$(python -c "import json,sys; data=json.loads(sys.argv[1]); print(data.get('crumb',''))" "$CRUMB_RESPONSE")
        fi

        echo "Triggering Jenkins job $JENKINS_JOB..."
        CURL_OPTS=("-s" "-o" "/dev/null" "-w" "%{http_code}" "-X" "POST" "$JENKINS_URL/job/$JENKINS_JOB/build" "-u" "$JENKINS_USER:$JENKINS_API_TOKEN")
        if [ -n "$CRUMB" ]; then
          CURL_OPTS+=("-H" "Jenkins-Crumb: $CRUMB")
        fi

        set +e
        HTTP_STATUS=$(curl "${CURL_OPTS[@]}")
        CURL_EXIT=$?
        set -e

        if [ $CURL_EXIT -ne 0 ]; then
          echo "Warning: Unable to reach Jenkins (curl exit $CURL_EXIT, status $HTTP_STATUS)."
          echo "Skipping Jenkins trigger but keeping workflow green. Ensure the runner can reach $JENKINS_URL."
          exit 0
        fi

        if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "200" ]; then
          echo "Warning: Jenkins responded with HTTP $HTTP_STATUS. Check credentials/job name."
        else
          echo "Jenkins job triggered (HTTP $HTTP_STATUS)."
        fi
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          tests/logs/
          *.log
