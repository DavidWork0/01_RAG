name: Run Tests

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - '**'

jobs:
  Unit_Tests:
    runs-on: ubuntu-latest
    steps:
    - name: Show disk usage before cleanup
      run: df -h
    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/lib/android
        sudo docker image prune --all --force
        sudo docker builder prune -a
    - name: Show disk usage after cleanup
      run: df -h
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_project_without_torch.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements_project_without_torch.txt
    
    - name: Run test_basics.py (pytest)
      run: |
        mkdir -p tests/unittest_logs
        pytest -q tests/test_basics.py --junitxml=tests/unittest_logs/junit_test_basics.xml
      env:
        PYTHONIOENCODING: utf-8

    - name: Run test_full.py (pytest)
      run: |
        pytest -q tests/test_full.py --junitxml=tests/unittest_logs/junit_test_full.xml
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Run test_reranking.py (pytest)
      run: |
        pytest -q tests/test_reranking.py --junitxml=tests/unittest_logs/junit_test_reranking.xml
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          tests/unittest_logs/
          *.log
