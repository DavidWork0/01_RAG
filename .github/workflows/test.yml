name: Run Tests

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_project_without_torch.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements_project_without_torch.txt
    
    - name: Run test_full.py
      run: |
        python tests/test_full.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Run test_reranking.py
      run: |
        python tests/test_reranking.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Run test_similarity_filter.py
      run: |
        python tests/test_similarity_filter.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          tests/logs/
          *.log
